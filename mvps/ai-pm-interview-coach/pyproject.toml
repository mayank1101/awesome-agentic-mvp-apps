[project]
name = "ai-pm-interview-coach"
version = "0.1.0"
description = "Runs a multi-turn PM mock interview and grades it against a fixed rubric, using Microsoft Agent Framework."
requires-python = ">=3.11"

# Runtime dependencies are pinned in requirements.txt; this file exists for tool
# configuration, so the lint rules travel with the repo.

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff formats Python fenced blocks inside Markdown. The design docs in docs/
# use illustrative snippets with `...` placeholders and deliberate alignment, so
# they are documentation rather than source and are left alone.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "D",   # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # long lines are prompt text, which reads worse when wrapped
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts are executed top to bottom, so module-level calls are the
# idiom rather than a smell.
"streamlit_app.py" = ["E402"]
# Test names describe themselves; a docstring on each would just repeat them.
# The same goes for the small fake classes a test file defines for fixtures --
# their names and the file's module docstring already say what they stand in for.
"tests/*" = ["D101", "D102", "D103", "D107"]

[tool.pytest.ini_options]
# So `pytest` works from the repo root without a PYTHONPATH dance.
pythonpath = ["."]
testpaths = ["tests"]
# The live-model test is opt-in: `pytest -m integration` with a real key set.
# Everything else runs with no network and no credentials.
markers = [
    "integration: hits a real model provider; deselected by default",
]
addopts = "-m 'not integration'"
# The live test uses async test functions; every other test is synchronous.
asyncio_mode = "auto"
