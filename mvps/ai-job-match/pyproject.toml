[project]
name = "ai-job-match"
version = "0.1.0"
description = "Scores a resume against a job description and rewrites it using only facts the resume already states."
requires-python = ">=3.11"

# Runtime dependencies are pinned in requirements.txt; this file exists for tool
# configuration, so the lint rules travel with the repo.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "D",   # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # long lines are prompt text, which reads worse when wrapped
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts are executed top to bottom, so module-level calls are the
# idiom rather than a smell.
"streamlit_app.py" = ["E402"]
# Test names describe themselves; a docstring on each would just repeat them.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D107"]
# Package init files do not need docstrings if empty.
"__init__.py" = ["D104"]
# These two modules hold ~70-word vocabulary lists. SIM905 wants a list literal,
# which the formatter then renders one word per line -- 70 lines nobody reads,
# and a diff nobody can review when a word is added. A split string is the
# readable form here.
"app/services/matching.py" = ["SIM905"]
"app/services/provenance.py" = ["SIM905"]
"app/services/scoring.py" = ["SIM905"]

[tool.pytest.ini_options]
# So `pytest` works from the repo root without a PYTHONPATH dance.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: marks tests requiring real API keys and live service calls",
]
# Live tests are opt-in: `pytest -m live`. The default suite is offline and
# deterministic, so a missing key is never the reason a run is red.
addopts = "-m 'not live'"
